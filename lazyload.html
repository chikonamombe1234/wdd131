<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A page demonstrating lazy-loaded images.">
  <title>Lazy-Loading Images</title>
  <link rel="stylesheet" href="styles/lazyload.css">
  <script src="scripts/lazyload.js" defer></script>
</head>
<body>
  <main>
    <h1>Lazy-Loading Images</h1>

    <img
      src="https://picsum.photos/seed/lazy1/400/650"
      alt="Portrait-format sample photograph one"
      width="400"
      height="650"
      loading="lazy"
      decoding="async"
    >
    <img
      src="https://picsum.photos/seed/lazy2/400/650"
      alt="Portrait-format sample photograph two"
      width="400"
      height="650"
      loading="lazy"
      decoding="async"
    >
    <img
      src="https://picsum.photos/seed/lazy3/400/650"
      alt="Portrait-format sample photograph three"
      width="400"
      height="650"
      loading="lazy"
      decoding="async"
    >
    <img
      src="https://picsum.photos/seed/lazy4/400/650"
      alt="Portrait-format sample photograph four"
      width="400"
      height="650"
      loading="lazy"
      decoding="async"
    >
    <img
      src="https://picsum.photos/seed/lazy5/400/650"
      alt="Portrait-format sample photograph five"
      width="400"
      height="650"
      loading="lazy"
      decoding="async"
    >
    <img
      src="https://picsum.photos/seed/lazy6/400/650"
      alt="Portrait-format sample photograph six"
      width="400"
      height="650"
      loading="lazy"
      decoding="async"
    >
  </main>

  <footer>
    <p>WDD 131 — Lazy-loading images activity</p>
    <p>Document last modified: <time id="last-modified"></time></p>
  </footer>
</body>
</html>
